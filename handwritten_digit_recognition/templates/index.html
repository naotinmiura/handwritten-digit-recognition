<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手書き数字認識システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>手書き数字認識システム</h1>
        </header>

        <main>
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <div class="upload-section">
                    <label for="image" class="upload-label">画像を選択してください</label>
                    <input type="file" name="image" id="image" accept="image/*" required>
                </div>
                <button type="submit" class="submit-button">認識開始</button>
            </form>

            {% if prediction is not none %}
                <div class="result">
                    <h2>認識結果: <span class="prediction">{{ prediction }}</span></h2>
                </div>
            {% endif %}

            {% if image_url %}
                <div class="image-preview">
                    <h3>アップロードされた画像</h3>
                    <img src="{{ url_for('uploaded_file', filename=image_url) }}" alt="Uploaded Image">
                </div>
            {% endif %}
        </main>

        <footer>
            <p>© 2025 手書き認識システム</p>
        </footer>
    </div>
</body>
</html>
